name: V7.5 publish authentic video posters
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v75-posters.sh'
      - '.github/workflows/v75-video-posters.yml'
permissions:
  contents: write
jobs:
  posters:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Ensure FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          fi
      - name: Extract real thumbnails from optimized video files
        run: bash .github/scripts/v75-posters.sh
      - name: Publish only four thumbnails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apercu-v75/media/poster-*.jpg
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "media: add true replay posters from encoded clips"
            git push origin HEAD:main
          fi
